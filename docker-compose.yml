services:
  # Service Base de données
  db:
    image: postgres:16
    container_name: smartbudget-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartbudget_db
    ports:
      - "5432:5432"

  # Service Backend
  backend:
    build: ./backend
    container_name: smartbudget-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/smartbudget_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db